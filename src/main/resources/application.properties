spring.application.name=dupdetect

# ===========================
# Database Configuration (H2 / PostgreSQL Mode for local out-of-the-box run)
# ===========================
spring.datasource.url=jdbc:h2:mem:dupdetect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===========================
# Redis
# ===========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ===========================
# Transaction Detection Configuration
# ===========================
# Use 'inmemory' (default, single-node) or 'redis' (distributed/multi-node)
transaction.store.type=inmemory
transaction.window.seconds=60
transaction.eviction.fixed-delay-ms=1000

# ===========================
# JWT Security
# ===========================
app.jwt.secret=${JWT_SECRET:dupdetect-super-secret-key-for-jwt-signing-at-least-256-bits}
app.jwt.expiration-ms=86400000

# ===========================
# Actuator / Observability
# ===========================
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.health.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ===========================
# CORS
# ===========================
spring.web.cors.allowed-origins=http://localhost:3000

# ===========================
# Resilience4j Ingestion Rate Limiter
# ===========================
resilience4j.ratelimiter.instances.transactionIngestion.limit-for-period=1000
resilience4j.ratelimiter.instances.transactionIngestion.limit-refresh-period=1s
resilience4j.ratelimiter.instances.transactionIngestion.timeout-duration=500ms

